name: Build EcoWatch Pune Android App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        run: |
          mkdir -p android-project
          unzip -o EcoWatchPune_Android_Source.zip -d android-project

      - name: Build Android APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoWatch-Pune-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
